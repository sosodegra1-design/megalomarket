# Intégration continue : lancer la suite de tests à chaque poussée.
#
# POURQUOI ÇA COMPTE ICI PLUS QU'AILLEURS. Le dépôt reçoit des contributions de
# plusieurs agents en parallèle. Sans ce contrôle, une poussée peut casser une
# fonctionnalité sans que personne ne s'en aperçoive avant la production — et
# Render déploie automatiquement sur la branche par défaut. Les tests existaient
# déjà (plus de 550) mais rien ne les lançait : c'était un confort, pas une
# garantie.
#
# Volontairement minimal : installer, tester. Pas de déploiement piloté par la
# CI — Render déploie déjà tout seul sur `main`, et ajouter un second chemin
# vers la production créerait deux mécanismes concurrents.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule l'exécution précédente : inutile de
# tester deux fois la même chose, et ça libère les minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = LTS la plus répandue ; 24 = ce qui tourne en local. Tester les
        # deux évite de découvrir un écart de version au moment du déploiement.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` (et non `npm install`) : installe exactement ce que décrit
      # package-lock.json, et échoue si les deux fichiers divergent — c'est
      # précisément l'écart qui casse un déploiement.
      - name: Installer les dépendances
        run: npm ci

      # Les tests fixent eux-mêmes leur DATABASE_PATH (base temporaire) : aucune
      # variable d'environnement n'est nécessaire ici, et surtout aucun test ne
      # peut atteindre une base réelle.
      - name: Lancer les tests
        run: npm test
